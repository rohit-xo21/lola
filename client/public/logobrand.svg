<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 80" width="280" height="80">
  <defs>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DFD0B8"/>
      <stop offset="100%" stop-color="#cfc0a6"/>
    </linearGradient>

    <linearGradient id="ribbonGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#222831"/>
      <stop offset="100%" stop-color="#2e3540"/>
    </linearGradient>

    <filter id="shadow2" x="-15%" y="-15%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0a0d11" flood-opacity="0.45"/>
    </filter>

    <clipPath id="card2clip">
      <rect x="0" y="0" width="62" height="72" rx="10" ry="10"/>
    </clipPath>
  </defs>

  <!-- Icon mark -->
  <g transform="translate(4, 4)" filter="url(#shadow2)">
    <!-- Cream card -->
    <rect x="0" y="0" width="62" height="72" rx="10" ry="10" fill="url(#cardGrad2)"/>
    <rect x="0" y="0" width="62" height="72" rx="10" ry="10" fill="none" stroke="#c0aa8e" stroke-width="1"/>

    <!-- Dark ribbon -->
    <path
      d="M13 0 L13 46 L31 35 L49 46 L49 0 Z"
      fill="url(#ribbonGrad2)"
      clip-path="url(#card2clip)"
    />

    <!-- Notch -->
    <path
      d="M13 46 L31 35 L49 46 L49 42 L31 31 L13 42 Z"
      fill="#1a1e24"
      opacity="0.45"
      clip-path="url(#card2clip)"
    />

    <!-- Spine -->
    <line x1="31" y1="0" x2="31" y2="33" stroke="#393E46" stroke-width="0.8" opacity="0.35" clip-path="url(#card2clip)"/>

    <!-- Lines -->
    <line x1="10" y1="55" x2="52" y2="55" stroke="#948979" stroke-width="1" opacity="0.5"/>
    <line x1="10" y1="63" x2="42" y2="63" stroke="#948979" stroke-width="1" opacity="0.3"/>

    <!-- Dots -->
    <circle cx="10" cy="55" r="1.5" fill="#948979" opacity="0.6"/>
    <circle cx="10" cy="63" r="1.5" fill="#948979" opacity="0.35"/>
  </g>

  <!-- Wordmark -->
  <text
    x="86"
    y="50"
    font-family="'Playfair Display', 'Georgia', serif"
    font-weight="700"
    font-size="38"
    letter-spacing="-0.5"
    fill="#DFD0B8"
  >Lola</text>

  <!-- Tagline -->
  <text
    x="88"
    y="66"
    font-family="'DM Mono', 'Courier New', monospace"
    font-size="11"
    letter-spacing="2.8"
    fill="#948979"
    opacity="0.65"
  >BOOKMARK MANAGER</text>
</svg>